name: Reproducibility checks

on:
  push:
  pull_request:

jobs:
  paper-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile *.py sim/*.py analysis/*.py
      - run: python validate_results.py --outputs reference_outputs --skip-reference --sensitivity-outputs reference_outputs/sensitivity
      - run: python reproduce.py --quick

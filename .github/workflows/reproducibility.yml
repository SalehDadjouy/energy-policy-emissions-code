name: Integrity and structural checks

on:
  push:
  pull_request:

jobs:
  paper-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-reproduction.txt
      - run: python -B reproduce.py --structural-only
